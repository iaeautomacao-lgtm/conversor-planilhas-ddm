<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Conversor de Arquivos DDM</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
</head>
<body>

  <div class="main-container" style="max-width: 42rem;">
    <!-- Voltar ao Dashboard -->
    <div style="margin-bottom: 2rem;">
      <a href="index.html" class="btn btn-ghost btn-sm">
        ← Voltar ao Dashboard
      </a>
    </div>

    <!-- Title -->
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 1.875rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.25rem;">Configurações</h1>
      <p style="color: var(--muted-foreground);">Gerencie as configurações do sistema</p>
    </div>

    <!-- Menu Cards -->
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <a href="integrations.html" style="text-decoration: none; color: inherit;">
        <div class="card" style="margin-bottom: 0; transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
          <div class="card-header">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="padding: 0.75rem; border-radius: var(--radius); background-color: rgba(37, 99, 235, 0.1); color: var(--primary); font-size: 1.25rem;">
                  🔗
                </div>
                <div>
                  <h2 class="card-title" style="font-size: 1.125rem;">Integrações</h2>
                  <p class="card-description">Configure as URLs de webhook para cada instituição</p>
                </div>
              </div>
              <div style="color: var(--muted-foreground); font-size: 1.25rem;">➔</div>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
